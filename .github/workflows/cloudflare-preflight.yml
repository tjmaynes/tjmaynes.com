name: Inspect Cloudflare project

on:
  push:
    branches: [feat/services-launch]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect existing project without changing it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/tjmaynes-site`, {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
            signal: AbortSignal.timeout(20000),
          });
          const body = await response.json();
          if (!response.ok || !body.success) throw new Error(`Cloudflare project lookup failed (${response.status}); codes: ${(body.errors || []).map(error => error.code).join(', ')}`);
          const project = body.result;
          console.log(JSON.stringify({
            name: project.name,
            production_branch: project.production_branch,
            domains: project.domains,
            build_command: project.build_config?.build_command,
            destination_dir: project.build_config?.destination_dir,
            source_type: project.source?.type,
            production_deployments_enabled: project.source?.config?.production_deployments_enabled,
            preview_deployment_setting: project.source?.config?.preview_deployment_setting,
            canonical_url: project.canonical_deployment?.url,
            web_analytics_enabled: Boolean(project.build_config?.web_analytics_token),
          }, null, 2));
          JS
